# Builds the Windows installer on GitHub's servers.
#  - Push a tag like v1.0.0  →  the installer is attached to a GitHub Release automatically.
#  - Or run it by hand from the "Actions" tab (the installer is then available as a downloadable artifact).
name: Build Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload installer (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Parley-installer
          path: dist/*.exe

      - name: Attach installer to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
